name: Website

# Builds website/ and deploys it to this repository's GitHub Pages (https://dev-hamxay.github.io/AyniteDM-releases/).
# No secrets needed. Runs on every push to main, after a release is published, or by hand.

on:
  push:
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/latest/download/
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      VITE_SUPPORT_URL: ${{ vars.SUPPORT_URL || 'https://aynitesoft.com' }}
      VITE_CHROME_STORE_URL: ${{ vars.CHROME_STORE_URL }}
      VITE_FIREFOX_ADDON_URL: ${{ vars.FIREFOX_ADDON_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Fetch the current add-on packages and update.json from the latest release
        shell: bash
        run: |
          mkdir -p website/public/downloads
          for f in update.json aynitedm-chrome-extension.zip aynitedm-firefox.xpi; do
            curl -fsSL "${VITE_DOWNLOAD_BASE}$f" -o "website/public/downloads/$f" || echo "no $f yet"
          done

      - name: Build
        working-directory: website
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
